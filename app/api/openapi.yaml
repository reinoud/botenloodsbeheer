# Contract van de API (ADR-012, BLB-034). Elke route van de blueprint staat hier; een test
# vergelijkt beide.
openapi: 3.1.0
info:
  title: Botenloodsbeheer API
  version: 0.8.2
  description: >
    Standaard alleen bereikbaar over het interne netwerk koppeling, via het entrypoint intern van
    Traefik op poort 8081. Met compose.api-extern.yml ook via https://DOMEIN/api/v1, alleen vanaf
    adressen in API_EXTERN_BRONNEN (anders 403 van Traefik).
    Elke aanroep heeft een token nodig (`Authorization: Bearer blb_...`). Het token moet bestaan,
    niet verlopen of ingetrokken zijn, de aanroep moet van een adres in de IP-whitelist komen en
    het token moet het recht van de aanroep hebben. Een persoonlijk token werkt alleen zolang de
    beheerder actief is; een lege whitelist betekent elk adres dat de installatie doorlaat. Een
    weigering geeft 401, of 403 bij een
    ontbrekend recht of als de API in de installatie uit staat, altijd met dezelfde tekst. Meer
    dan 60 aanroepen per minuut per token geeft 429 met `Retry-After`. Een onbekend pad geeft 404
    en een methode die het pad niet kent 405 (met `Allow`), een pad met procentcodering of een
    NUL-teken in de querystring 400, alle als JSON met `fout`. Een
    lichaam boven 2 MB geeft op elk pad 413 (zie TeGroot); alleen PUT /leden en
    POST /leden/import-mislukt nemen een lichaam aan en noemen hem.
servers:
  - url: http://traefik:8081/api/v1
  - url: https://DOMEIN/api/v1
    description: Alleen met compose.api-extern.yml
security:
  - token: []
paths:
  /ik:
    get:
      summary: Naam, rechten en vervaldatum van het token
      description: "Recht: elk geldig token. Argumenten: geen."
      responses:
        "200":
          description: Het token van deze aanroep
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ik"
              example:
                token: integratie
                rechten: [leden:importeren, bootaantallen:lezen]
                verloopt_op: "2027-10-31"
        "401":
          $ref: "#/components/responses/GeenToegang"
        "403":
          $ref: "#/components/responses/GeenToegang"
        "429":
          $ref: "#/components/responses/TeVeel"
  /leden/importverzoek:
    get:
      summary: Staat er een importverzoek van een beheerder klaar?
      description: "Recht: `leden:importeren`. Argumenten: geen."
      responses:
        "200":
          description: true als een beheerder in de webinterface een import heeft aangevraagd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Importverzoek"
              example:
                aangevraagd: false
        "401":
          $ref: "#/components/responses/GeenToegang"
        "403":
          $ref: "#/components/responses/GeenToegang"
        "429":
          $ref: "#/components/responses/TeVeel"
  /leden:
    get:
      summary: Alle leden en oud-leden, op lidnummer
      description: >
        Recht: `leden:lezen`. Argumenten: geen. De hele lijst. Adres, telefoon, e-mail, lid sinds
        en opzegdatum alleen met het recht `persoonsgegevens`; zonder dat recht ontbreken die
        velden. Een veld zonder waarde is `null`.
      responses:
        "200":
          description: Eén element per lid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leden"
              examples:
                zonder_persoonsgegevens:
                  value:
                    - {lidnummer: "1001", naam: Anna Voorbeeld, oud_lid: false}
                met_persoonsgegevens:
                  value:
                    - lidnummer: "1001"
                      naam: Anna Voorbeeld
                      oud_lid: false
                      adres: Proefweg 1, 1234 AB Voorbeelddorp
                      telefoon: 06-00000000
                      email: anna@example.org
                      lid_sinds: "2020-04-01"
                      opzegdatum: null
        "401":
          $ref: "#/components/responses/GeenToegang"
        "403":
          $ref: "#/components/responses/GeenToegang"
        "429":
          $ref: "#/components/responses/TeVeel"
    put:
      summary: Importeert de volledige ledenlijst uit de bron
      description: >
        Recht: `leden:importeren`. Altijd de volledige lijst: een lid dat ontbreekt, wordt
        oud-lid. Nieuwe leden worden aangemaakt en gewijzigde bijgewerkt, met het lidnummer als
        sleutel. Een ongeldig record wordt overgeslagen en geteld, zonder de inhoud te loggen.
        Een nieuw record met een opzegdatum van meer dan 5 jaar geleden wordt overgeslagen.
        De uitkomst sluit een open importverzoek af. Wijzigingen in leden komen niet in het log.
        Een veld dat in het record ontbreekt, geldt als leeg en overschrijft de bewaarde waarde:
        de bron e-boekhouden stuurt geen adres, telefoon of e-mail, dus die zijn dan leeg.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Ledenlijst"
            example:
              leden:
                - lidnummer: "1001"
                  naam: Anna Voorbeeld
                  adres: Proefweg 1, 1234 AB Voorbeelddorp
                  telefoon: 06-00000000
                  email: anna@example.org
                  lid_sinds: "2020-04-01"
                  opzegdatum: null
      responses:
        "200":
          description: Geïmporteerd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Importuitkomst"
              example:
                ontvangen: 210
                nieuw: 0
                bijgewerkt: 3
                uit_bron: 1
                ongeldig: 0
                overgeslagen: 2
        "401":
          $ref: "#/components/responses/GeenToegang"
        "403":
          $ref: "#/components/responses/GeenToegang"
        "409":
          description: >
            Er loopt al een import of de dagelijkse opschoning (die hetzelfde slot neemt), of de
            lijst bevat minder dan de helft van het aantal actieve leden (veiligheidsgrens). Er is
            niets gewijzigd; de veiligheidsgrens staat als mislukte import bij de leden. Bij een
            lopende import of opschoning is de tekst "Er loopt al een import."; probeer later
            opnieuw.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fout"
              example:
                fout: Er loopt al een import.
        "413":
          $ref: "#/components/responses/TeGroot"
        "422":
          $ref: "#/components/responses/Ongeldig"
        "429":
          $ref: "#/components/responses/TeVeel"
  /leden/import-mislukt:
    post:
      summary: Meldt dat de bron geen leden leverde
      description: >
        Recht: `leden:importeren`. De reden komt uit een vaste lijst, zodat geen tekst van buiten
        in de applicatie komt. De melding sluit een open importverzoek af.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Importfout"
            example:
              reden: bron_onbereikbaar
      responses:
        "201":
          description: Vastgelegd
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
              example: {}
        "401":
          $ref: "#/components/responses/GeenToegang"
        "403":
          $ref: "#/components/responses/GeenToegang"
        "413":
          $ref: "#/components/responses/TeGroot"
        "422":
          $ref: "#/components/responses/Ongeldig"
        "429":
          $ref: "#/components/responses/TeVeel"
  /plaatsen:
    get:
      summary: Alle plaatsen, in de volgorde van het overzicht
      description: >
        Recht: `plaatsen:lezen`. Argumenten: geen. De hele lijst, zonder filters of paginering.
        Geen persoonsgegevens. `boot` is `null` bij een lege plaats.
      responses:
        "200":
          description: Eén element per plaats, per rek in de volgorde van de loods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plaatsen"
              example:
                - code: A/1/1
                  rek: A
                  clubplaats: false
                  bootsoorten: [Kajak, Surfski]
                  boot: {id: 7, naam: Zeemeeuw}
                - code: A/1/2
                  rek: A
                  clubplaats: true
                  bootsoorten: [Kajak]
                  boot: null
        "401":
          $ref: "#/components/responses/GeenToegang"
        "403":
          $ref: "#/components/responses/GeenToegang"
        "429":
          $ref: "#/components/responses/TeVeel"
  /boten:
    get:
      summary: Alle boten, op naam
      description: >
        Recht: `boten:lezen`. Argumenten: geen. De hele lijst. `plaats` is de plaatscode of
        `null`; `eigenaar` is `null` bij een clubboot. Adres, telefoon en e-mail van de eigenaar
        staan er alleen in met het recht `persoonsgegevens`; zonder dat recht ontbreken die velden.
      responses:
        "200":
          description: Eén element per boot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Boten"
              examples:
                zonder_persoonsgegevens:
                  value:
                    - id: 7
                      naam: Zeemeeuw
                      bootsoort: Kajak
                      plaats: A/1/1
                      eigenaar: {lidnummer: "1001", naam: Anna Voorbeeld}
                met_persoonsgegevens:
                  value:
                    - id: 7
                      naam: Zeemeeuw
                      bootsoort: Kajak
                      plaats: A/1/1
                      eigenaar: {lidnummer: "1001", naam: Anna Voorbeeld,
                                 adres: "Proefweg 1, 1234 AB Voorbeelddorp",
                                 telefoon: 06-00000000, email: anna@example.org}
        "401":
          $ref: "#/components/responses/GeenToegang"
        "403":
          $ref: "#/components/responses/GeenToegang"
        "429":
          $ref: "#/components/responses/TeVeel"
  /wachtlijst:
    get:
      summary: De wachtlijst, per bootsoort de langst wachtende eerst
      description: >
        Recht: `wachtlijst:lezen`. Argumenten: geen. Boten van oud-leden staan er niet in, net als
        op het scherm. Adres, telefoon en e-mail van de eigenaar alleen met `persoonsgegevens`.
      responses:
        "200":
          description: Eén element per boot op de wachtlijst
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wachtlijst"
              example:
                - bootsoort: Kajak
                  boot: {id: 12, naam: Reiger}
                  eigenaar: {lidnummer: "1002", naam: Bert Voorbeeld}
                  aangemeld_op: "2026-03-01"
        "401":
          $ref: "#/components/responses/GeenToegang"
        "403":
          $ref: "#/components/responses/GeenToegang"
        "429":
          $ref: "#/components/responses/TeVeel"
  /bootaantallen:
    get:
      summary: Aantal boten per bootsoort per lid, voor terugschrijven naar de ledenbron
      description: >
        Recht: `bootaantallen:lezen`. Argumenten: geen. Voor elk lid elke bootsoort met het
        aantal, ook 0. Alleen boten met een toegewezen plaats tellen; een boot op de wachtlijst
        zonder plaats en een clubboot tellen niet. Dezelfde aantallen staan in de lijst per lid.
        De meegeleverde integratiecontainer roept dit op na elke geslaagde import en schrijft de
        aantallen als JSON-tekst in vrij veld 10 van het lid in e-boekhouden, maar alleen met
        `BOOTAANTALLEN_SCHRIJVEN=aan`; die schakelaar staat standaard uit. De aanroep zelf zet
        alleen het tijdstip van ophalen op de statuspagina.
      responses:
        "200":
          description: Eén regel per lid, op lidnummer gesorteerd
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootaantallen"
              example:
                - lidnummer: "1001"
                  aantallen: {Kajak: 1, Canadese kano: 0, Surfski: 0, C11: 0, Supboard: 0}
                - lidnummer: "1002"
                  aantallen: {Kajak: 0, Canadese kano: 0, Surfski: 0, C11: 0, Supboard: 0}
        "401":
          $ref: "#/components/responses/GeenToegang"
        "403":
          $ref: "#/components/responses/GeenToegang"
        "429":
          $ref: "#/components/responses/TeVeel"
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
  schemas:
    Ik:
      type: object
      required: [token, rechten, verloopt_op]
      additionalProperties: false
      properties:
        token:
          type: string
          description: Naam van het token
        rechten:
          type: array
          minItems: 1
          items:
            type: string
            enum: [plaatsen:lezen, boten:lezen, leden:lezen, wachtlijst:lezen, persoonsgegevens,
                   leden:importeren, bootaantallen:lezen]
        verloopt_op:
          type: string
          format: date
          description: Dag waarop het token verloopt, JJJJ-MM-DD
    Bootkort:
      type: [object, "null"]
      required: [id, naam]
      additionalProperties: false
      properties:
        id:
          type: integer
        naam:
          type: string
    Eigenaar:
      type: [object, "null"]
      description: "`null` bij een clubboot. Adres, telefoon en e-mail alleen met `persoonsgegevens`."
      required: [lidnummer, naam]
      additionalProperties: false
      properties:
        lidnummer:
          type: string
        naam:
          type: string
        adres:
          type: [string, "null"]
        telefoon:
          type: [string, "null"]
        email:
          type: [string, "null"]
    Plaatsen:
      type: array
      items:
        type: object
        required: [code, rek, clubplaats, bootsoorten, boot]
        additionalProperties: false
        properties:
          code:
            type: string
          rek:
            type: string
          clubplaats:
            type: boolean
          bootsoorten:
            type: array
            items:
              type: string
          boot:
            $ref: "#/components/schemas/Bootkort"
    Boten:
      type: array
      items:
        type: object
        required: [id, naam, bootsoort, plaats, eigenaar]
        additionalProperties: false
        properties:
          id:
            type: integer
          naam:
            type: string
          bootsoort:
            type: string
          plaats:
            type: [string, "null"]
          eigenaar:
            $ref: "#/components/schemas/Eigenaar"
    Leden:
      type: array
      items:
        type: object
        required: [lidnummer, naam, oud_lid]
        additionalProperties: false
        properties:
          lidnummer:
            type: string
          naam:
            type: string
          oud_lid:
            type: boolean
          adres:
            type: [string, "null"]
          telefoon:
            type: [string, "null"]
          email:
            type: [string, "null"]
          lid_sinds:
            type: [string, "null"]
            format: date
          opzegdatum:
            type: [string, "null"]
            format: date
    Wachtlijst:
      type: array
      items:
        type: object
        required: [bootsoort, boot, eigenaar, aangemeld_op]
        additionalProperties: false
        properties:
          bootsoort:
            type: string
          boot:
            $ref: "#/components/schemas/Bootkort"
          eigenaar:
            $ref: "#/components/schemas/Eigenaar"
          aangemeld_op:
            type: string
            format: date
    Bootaantallen:
      type: array
      items:
        type: object
        required: [lidnummer, aantallen]
        additionalProperties: false
        properties:
          lidnummer:
            type: string
          aantallen:
            type: object
            description: Bootsoort als sleutel, aantal als waarde; elke bootsoort staat erin
            additionalProperties:
              type: integer
              minimum: 0
    Importverzoek:
      type: object
      required: [aangevraagd]
      additionalProperties: false
      properties:
        aangevraagd:
          type: boolean
    Ledenlijst:
      type: object
      required: [leden]
      properties:
        leden:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/Lidrecord"
    Lidrecord:
      type: object
      description: >
        Een record zonder geldig lidnummer (1 tot 20 tekens, letters, cijfers en -), zonder naam,
        met een ongeldige datum of e-mail telt als ongeldig. Langere tekst wordt ingekort.
      required: [lidnummer, naam]
      properties:
        lidnummer:
          type: [string, integer]
        naam:
          type: string
          maxLength: 100
        adres:
          type: [string, "null"]
          maxLength: 200
        telefoon:
          type: [string, "null"]
          maxLength: 30
        email:
          type: [string, "null"]
          maxLength: 254
        lid_sinds:
          type: [string, "null"]
          format: date
        opzegdatum:
          type: [string, "null"]
          format: date
          description: Mag in de toekomst liggen; het lid blijft dan lid tot die datum
    Importuitkomst:
      type: object
      required: [ontvangen, nieuw, bijgewerkt, uit_bron, ongeldig, overgeslagen]
      additionalProperties: false
      properties:
        ontvangen:
          type: integer
        nieuw:
          type: integer
        bijgewerkt:
          type: integer
        uit_bron:
          type: integer
          description: Leden die ontbraken en oud-lid zijn geworden
        ongeldig:
          type: integer
        overgeslagen:
          type: integer
          description: Nieuwe records met een opzegdatum van meer dan 5 jaar geleden
    Importfout:
      type: object
      required: [reden]
      properties:
        reden:
          type: string
          enum: [bron_onbereikbaar, bron_onleesbaar, bron_geweigerd]
    Fout:
      type: object
      required: [fout]
      properties:
        fout:
          type: string
  responses:
    GeenToegang:
      description: Geweigerd; de reden staat in het log, niet in het antwoord
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fout"
          example:
            fout: Geen toegang.
    TeGroot:
      description: >
        Het verzoek is groter dan 2 MB; er is niets gewijzigd. Boven 3 MB antwoordt Traefik met
        platte tekst (ADR-013).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fout"
          example:
            fout: Het verzoek is groter dan 2 MB.
    Ongeldig:
      description: Het verzoek heeft niet de vorm uit dit contract; er is niets gewijzigd
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fout"
          example:
            fout: leden moet een lijst zijn van hooguit 5000 records.
    TeVeel:
      description: >
        Meer dan 60 aanroepen per minuut met dit token, of meer dan 300 per minuut vanaf dit adres.
        Het antwoord komt van Traefik, met de tekst Too Many Requests en zonder Content-Type (ADR-013);
        lees alleen de status.
      headers:
        Retry-After:
          description: Aantal seconden tot het token weer mag
          schema:
            type: integer
