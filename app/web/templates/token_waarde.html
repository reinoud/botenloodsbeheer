{% extends "base.html" %}
{% block titel %}Token gemaakt · {{ vereniging }}{% endblock %}
{% block inhoud %}
<h1>Token {{ naam }} gemaakt</h1>
<p>Kopieer de waarde nu. Hij staat nergens anders en is hierna niet meer te zien.</p>
<p><code id="tokenwaarde">{{ waarde }}</code></p>
<p><a href="{{ url_for('web.tokens_overzicht') }}">Terug naar tokens</a></p>
{% endblock %}
