# Bouwt bij elke gepubliceerde release de images en pusht ze naar ghcr.io (alleen amd64).
# Tag v1.2.3 levert 1.2.3, 1.2 en latest; een prerelease krijgt alleen zijn eigen tag.
# Trivy scant elk image vóór de push; critical of high met een oplossing stopt de release (#59).
# Actions staan op een commit-SHA (#61); Dependabot houdt ze bij.
name: Images

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - naam: botenloods-app
            context: .
            dockerfile: docker/Dockerfile
            target: app
          - naam: botenloods-integratie
            context: integratie
            dockerfile: integratie/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.naam }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: APP_VERSIE=${{ steps.meta.outputs.version }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.naam }}
          cache-to: type=gha,mode=max,scope=${{ matrix.naam }}
      - name: Trivy
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
          image --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1
          ghcr.io/${{ github.repository_owner }}/${{ matrix.naam }}:${{ steps.meta.outputs.version }}
      # Precies het gescande image, met al zijn tags.
      - name: Push
        run: docker push --all-tags ghcr.io/${{ github.repository_owner }}/${{ matrix.naam }}
