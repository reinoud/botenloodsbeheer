# Bouwt bij elke gepubliceerde release de images en pusht ze naar ghcr.io (alleen amd64).
# Tag v1.2.3 levert 1.2.3, 1.2 en latest; een prerelease krijgt alleen zijn eigen tag.
name: Images

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - naam: botenloods-app
            context: .
            dockerfile: docker/Dockerfile
            target: app
          - naam: botenloods-integratie
            context: integratie
            dockerfile: integratie/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.naam }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: APP_VERSIE=${{ steps.meta.outputs.version }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.naam }}
          cache-to: type=gha,mode=max,scope=${{ matrix.naam }}
