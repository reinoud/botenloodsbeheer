# Voorbeeld van een gedeelde Traefik in een eigen stack (ADR-013, documentatie/beheer/installatie.md).
# Per installatie op de host staan haar twee netwerken hieronder; maak die eerst aan.
# Start: ACME_EMAIL=beheer@example.org docker compose up -d
services:
  # Traefik leest de Docker-API via deze proxy, alleen lezen en alleen containers.
  socketproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.4.1
    restart: unless-stopped
    environment:
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket]

  traefik:
    image: traefik:v3.7.17
    restart: unless-stopped
    command:
      - --providers.docker.endpoint=tcp://socketproxy:2375
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Niet publiceren: alleen voor de integratiecontainer op koppeling.
      - --entrypoints.intern.address=:8081
      # Kop als X_Forwarded_For weghalen in plaats van ongewijzigd doorgeven (ADR-013).
      - --entrypoints.web.http.aliasheadersstrategy=delete
      - --entrypoints.websecure.http.aliasheadersstrategy=delete
      - --entrypoints.intern.http.aliasheadersstrategy=delete
      # Load balancer vóór Traefik: vertrouw het PROXY protocol alleen van zijn adressen, op
      # websecure en op web als die ook poort 80 doorstuurt. Nooit op intern (ADR-013, #54).
      # Alleen als de load balancer op elke verbinding zelf een PROXY-kop zet (send-proxy), en
      # alleen met zijn exacte adressen (/32 of /128); anders kiest een client zijn eigen adres.
      # - --entrypoints.websecure.proxyprotocol.trustedips=192.0.2.10/32
      # Gecodeerde tekens in het pad weigeren: Traefik geeft zelf 400 (ADR-013).
      - --entrypoints.web.http.encodedcharacters.allowencodedslash=false
      - --entrypoints.web.http.encodedcharacters.allowencodedbackslash=false
      - --entrypoints.web.http.encodedcharacters.allowencodednullcharacter=false
      - --entrypoints.web.http.encodedcharacters.allowencodedpercent=false
      - --entrypoints.websecure.http.encodedcharacters.allowencodedslash=false
      - --entrypoints.websecure.http.encodedcharacters.allowencodedbackslash=false
      - --entrypoints.websecure.http.encodedcharacters.allowencodednullcharacter=false
      - --entrypoints.websecure.http.encodedcharacters.allowencodedpercent=false
      - --entrypoints.intern.http.encodedcharacters.allowencodedslash=false
      - --entrypoints.intern.http.encodedcharacters.allowencodedbackslash=false
      - --entrypoints.intern.http.encodedcharacters.allowencodednullcharacter=false
      - --entrypoints.intern.http.encodedcharacters.allowencodedpercent=false
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL ontbreekt}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
    ports: ["80:80", "443:443"]
    volumes:
      - acme:/acme
    networks:
      socket: {}
      extern: {}
      botenloods_voorkant: {}
      botenloods_koppeling: {aliases: [traefik]}
    depends_on: [socketproxy]

networks:
  socket:
    internal: true
  extern: {}
  botenloods_voorkant:
    external: true
  botenloods_koppeling:
    external: true

volumes:
  acme:
