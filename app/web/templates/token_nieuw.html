{% extends "base.html" %}
{% block titel %}Token maken · {{ vereniging }}{% endblock %}
{% block inhoud %}
<h1>Token maken</h1>
<form class="bl-formulier" method="post" action="{{ url_for('web.token_nieuw') }}">
  {% include "_csrf.html" %}
  <div class="bl-paar">
    <section class="dj-panel bl-paneel" aria-labelledby="wie-kop">
      <h2 class="dj-panel__title" id="wie-kop">Wie en hoe lang</h2>
      <fieldset class="dj-choices">
        <legend>Soort</legend>
        <div class="ds-check"><input class="bl-radio" type="radio" id="soort-persoonlijk" name="soort" value="persoonlijk"{% if invoer.soort != 'robot' %} checked{% endif %}><label for="soort-persoonlijk">Persoonlijk: hoort bij jou en werkt niet meer als je account geblokkeerd of verwijderd is</label></div>
        <div class="ds-check"><input class="bl-radio" type="radio" id="soort-robot" name="soort" value="robot"{% if invoer.soort == 'robot' %} checked{% endif %}><label for="soort-robot">Robot: voor een koppeling, blijft werken als jij vertrekt</label></div>
      </fieldset>
      <div class="ds-field">
        <label class="ds-field__label" for="naam">Naam (a-z, cijfers, punt, - en _)</label>
        <input class="ds-input" id="naam" name="naam" type="text" value="{{ invoer.naam }}" maxlength="50" required>
      </div>
      <div class="ds-field">
        <label class="ds-field__label" for="dagen">Geldig, in dagen (hooguit {{ max_dagen }}, dat is 3 jaar)</label>
        <input class="ds-input" id="dagen" name="dagen" type="number" min="1" max="{{ max_dagen }}" value="{{ invoer.dagen }}" required>
      </div>
    </section>
    <section class="dj-panel bl-paneel" aria-labelledby="mag-kop">
      <h2 class="dj-panel__title" id="mag-kop">Wat mag het token</h2>
      <fieldset class="dj-choices dj-choices--columns">
        <legend>Rechten (minstens één)</legend>
        {% for r in rechten %}
        <div class="ds-check"><input type="checkbox" id="recht-{{ r }}" name="recht" value="{{ r }}"{% if r in invoer.rechten %} checked{% endif %}><label for="recht-{{ r }}">{{ r }}</label></div>
        {% endfor %}
      </fieldset>
      <div class="ds-field bl-breed">
        <label class="ds-field__label" for="whitelist">IP-whitelist: adressen of reeksen, gescheiden door komma's. Verplicht bij een robot. Leeg bij een persoonlijk token: elk adres dat de installatie doorlaat.</label>
        <input class="ds-input" id="whitelist" name="whitelist" type="text" value="{{ invoer.whitelist }}">
      </div>
    </section>
  </div>
  <div class="bl-vast"><button type="submit" class="ds-btn ds-btn--primary">Token maken</button></div>
</form>
<p><a href="{{ url_for('web.tokens_overzicht') }}">Terug naar tokens</a></p>
{% endblock %}
