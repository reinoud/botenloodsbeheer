# Lokaal: docker compose -f docker-compose.yml -f compose.dev.yml up --build
# Draait op http://localhost:8080 zonder TLS, met herladen van de code, achter een eigen Traefik.
# Compose maakt de netwerken voorkant en koppeling hier zelf aan (in productie de beheerder).

services:
  # Lokaal is de database ook op 127.0.0.1 te bereiken; daarvoor moet hij op een netwerk met uitgang.
  db:
    ports: !override ["127.0.0.1:5432:5432"]
    networks: [achterkant, lokaal]

  # Lokaal het testlogo uit tests/fixtures.
  # Lokaal zonder TLS: de routers op het entrypoint web, de doorverwijzing naar https uit.
  web:
    environment:
      GUNICORN_CMD_ARGS: --reload
      TEMPLATES_AUTO_RELOAD: "true"
      LOGO_BESTAND: /app/tests/fixtures/logo.png
    labels:
      - traefik.http.routers.${INSTALLATIE:-botenloods}-web.entrypoints=web
      - traefik.http.routers.${INSTALLATIE:-botenloods}-web.tls=false
      - traefik.http.routers.${INSTALLATIE:-botenloods}-boten.entrypoints=web
      - traefik.http.routers.${INSTALLATIE:-botenloods}-boten.tls=false
      - traefik.http.routers.${INSTALLATIE:-botenloods}-inloggen.entrypoints=web
      - traefik.http.routers.${INSTALLATIE:-botenloods}-inloggen.tls=false
      - traefik.http.routers.${INSTALLATIE:-botenloods}-http.entrypoints=websecure
    volumes:
      - ./app:/app/app:ro
      - ./tests/fixtures:/app/tests/fixtures:ro

  api:
    environment:
      GUNICORN_CMD_ARGS: --reload
    volumes:
      - ./app:/app/app:ro

  worker:
    volumes:
      - ./app:/app/app:ro

  # Lokaal is de stub de ledenbron, met de synthetische leden uit tests/fixtures.
  integratie:
    environment:
      LEDENBRON: stub
      LEDENBRON_STUB_BESTAND: /data/leden.json
    volumes:
      - ./tests/fixtures/leden.json:/data/leden.json:ro

  # Eigen Traefik met dezelfde tag als in productie (ADR-013). De statische instellingen staan hier
  # en niet in een bestand, omdat de constraint INSTALLATIE nodig heeft: zo ziet deze Traefik
  # alleen de containers van deze installatie, ook als een tweede stack draait (screenshots).
  # Toegangslog aan, zoals een gedeelde Traefik: de routers zetten hem uit.
  traefik:
    image: traefik:v3.7.17@sha256:30ff62491aacdb862ceb8c9edcf2627da638d7deafdd4b6dab32fe34f8aa3e90
    restart: unless-stopped
    command:
      - --providers.docker.exposedbydefault=false
      - --providers.docker.constraints=Label(`traefik.docker.network`,`${INSTALLATIE:-botenloods}_voorkant`)
      - --entrypoints.web.address=:8080
      - --entrypoints.websecure.address=:8443
      - --entrypoints.intern.address=:8081
      # Gecodeerde tekens in het pad weigeren (ADR-013, #65): Traefik geeft zelf 400.
      - --entrypoints.web.http.encodedcharacters.allowencodedslash=false
      - --entrypoints.web.http.encodedcharacters.allowencodedbackslash=false
      - --entrypoints.web.http.encodedcharacters.allowencodednullcharacter=false
      - --entrypoints.web.http.encodedcharacters.allowencodedpercent=false
      - --entrypoints.websecure.http.encodedcharacters.allowencodedslash=false
      - --entrypoints.websecure.http.encodedcharacters.allowencodedbackslash=false
      - --entrypoints.websecure.http.encodedcharacters.allowencodednullcharacter=false
      - --entrypoints.websecure.http.encodedcharacters.allowencodedpercent=false
      - --entrypoints.intern.http.encodedcharacters.allowencodedslash=false
      - --entrypoints.intern.http.encodedcharacters.allowencodedbackslash=false
      - --entrypoints.intern.http.encodedcharacters.allowencodednullcharacter=false
      - --entrypoints.intern.http.encodedcharacters.allowencodedpercent=false
      - --accesslog=true
      - --log.level=INFO
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      voorkant: {}
      koppeling: {aliases: [traefik]}
      lokaal: {}

  # Unit- en integratietests tegen een eigen database botenloods_test op dezelfde server:
  # docker compose -f docker-compose.yml -f compose.dev.yml run --rm test
  test:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    image: botenloods-dev
    command: ["pytest"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_WEB_WACHTWOORD: ${DB_WEB_WACHTWOORD}
      DB_TAKEN_WACHTWOORD: ${DB_TAKEN_WACHTWOORD}
      DB_API_WACHTWOORD: ${DB_API_WACHTWOORD}
    networks: [achterkant]
    volumes:
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
      - ./migrations:/app/migrations:ro
      - ./integratie:/app/integratie:ro
      - ./documentatie:/app/documentatie:ro
      - ./.env.example:/app/.env.example:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./compose.dev.yml:/app/compose.dev.yml:ro
      - ./compose.api-extern.yml:/app/compose.api-extern.yml:ro
    depends_on:
      db: {condition: service_healthy}

  # E2E met Playwright tegen de draaiende stack: tests/e2e/draai.sh. Deelt het netwerk van
  # traefik: http://localhost:8080 is Traefik, en de API is bereikbaar via zijn adres op koppeling.
  e2e:
    profiles: [e2e]
    build:
      context: tests/e2e
    network_mode: "service:traefik"
    environment:
      E2E_BASIS_URL: http://localhost:8080
    volumes:
      - ./tests/e2e:/e2e
      - ./tests/fixtures/leden.json:/fixtures/leden.json:ro
    working_dir: /e2e
    command: ["pytest", "-p", "no:cacheprovider"]

# Lokaal maakt compose de netwerken zelf aan; lokaal is alleen voor de poorten naar de host.
networks:
  voorkant:
    external: false
    internal: true
  koppeling:
    external: false
    internal: true
    ipam:
      config:
        - subnet: ${KOPPELNET:-10.203.0.0/24}
  lokaal: {}
