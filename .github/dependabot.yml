# Updates van afhankelijkheden en actions (#59, #61), pas na twee weken (cooldown), net als de
# regel voor exclude-newer. Let op: exclude-newer in pyproject.toml is een vaste datum. Dependabot
# lockt binnen die grens en stelt voor uv dus pas iets voor nadat de regie die datum ophoogt.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  # Basisimages staan op een digest (#25); Dependabot stelt een nieuwe digest voor als de tag wordt
  # herbouwd, zodat beveiligingsupdates van Debian binnenkomen.
  - package-ecosystem: docker
    directories:
      - /docker
      - /integratie
      - /tests/e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # Versie hoort bij playwright in tests/e2e/requirements.txt, dat Dependabot niet bijhoudt.
      - dependency-name: mcr.microsoft.com/playwright/python
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
