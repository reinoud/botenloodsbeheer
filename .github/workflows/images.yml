# Bouwt bij elke gepubliceerde release de images en pusht ze naar ghcr.io (alleen amd64).
# Tag v1.2.3 levert 1.2.3, 1.2 en latest; een prerelease krijgt alleen zijn eigen tag.
# Trivy scant elk image vóór de push; critical of high met een oplossing stopt de release (#59).
# Actions staan op een commit-SHA (#61); Dependabot houdt ze bij.
name: Images

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - naam: botenloods-app
            context: .
            dockerfile: docker/Dockerfile
            target: app
          - naam: botenloods-integratie
            context: integratie
            dockerfile: integratie/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.naam }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: APP_VERSIE=${{ steps.meta.outputs.version }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.naam }}
          cache-to: type=gha,mode=max,scope=${{ matrix.naam }}
      # Het image staat in docker/Dockerfile.trivy, zodat Dependabot het bijhoudt (#105).
      - name: Trivy
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          "$(awk '/^FROM/ {print $2}' docker/Dockerfile.trivy)"
          image --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1
          ghcr.io/${{ github.repository_owner }}/${{ matrix.naam }}:${{ steps.meta.outputs.version }}
      # Precies het gescande image, met al zijn tags.
      - name: Push
        run: docker push --all-tags ghcr.io/${{ github.repository_owner }}/${{ matrix.naam }}
