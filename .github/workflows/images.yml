# Bouwt bij elke gepubliceerde release de images en pusht ze naar ghcr.io (alleen amd64).
# Tag v1.2.3 levert 1.2.3, 1.2 en latest; een prerelease krijgt alleen zijn eigen tag.
# Trivy scant elk image vóór de push; critical of high met een oplossing stopt de release (#59).
# Van hetzelfde image maakt Trivy vóór de push een SBOM (CycloneDX JSON); de job sbom zet die
# na de push als bijlage bij de release (#297). Alleen die job mag de release wijzigen.
# Actions staan op een commit-SHA (#61); Dependabot houdt ze bij.
name: Images

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - naam: botenloods-app
            context: .
            dockerfile: docker/Dockerfile
            target: app
          - naam: botenloods-integratie
            context: integratie
            dockerfile: integratie/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.naam }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: APP_VERSIE=${{ steps.meta.outputs.version }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Geen buildcache: anders haalt apt-get geen beveiligingsupdates (#272).
      # Het image staat in docker/Dockerfile.trivy, zodat Dependabot het bijhoudt (#105).
      - name: Trivy
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          "$(awk '/^FROM/ {print $2}' docker/Dockerfile.trivy)"
          image --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1
          ghcr.io/${{ github.repository_owner }}/${{ matrix.naam }}:${{ steps.meta.outputs.version }}
      # Vóór de push: een fout hier pusht niets. Alleen pakketten, geen kwetsbaarheden (#297).
      - name: SBOM
        run: |
          f=${{ matrix.naam }}-${{ steps.meta.outputs.version }}.cdx.json
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "$(awk '/^FROM/ {print $2}' docker/Dockerfile.trivy)" \
            image --format cyclonedx \
            ghcr.io/${{ github.repository_owner }}/${{ matrix.naam }}:${{ steps.meta.outputs.version }} > "$f"
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' "$f"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.naam }}
          path: ${{ matrix.naam }}-${{ steps.meta.outputs.version }}.cdx.json
          if-no-files-found: error
          overwrite: true  # een herhaalde poging na een mislukte push uploadt opnieuw
      # Precies het gescande image, met al zijn tags.
      - name: Push
        run: docker push --all-tags ghcr.io/${{ github.repository_owner }}/${{ matrix.naam }}

  # Na beide pushes, zodat de release alleen een SBOM krijgt van een image dat in ghcr.io staat.
  # Mislukt deze job, draai hem dan opnieuw; --clobber vervangt een half geüploade bijlage.
  sbom:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          merge-multiple: true
      - name: Bijlage bij de release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" ./*.cdx.json --clobber --repo "$GITHUB_REPOSITORY"
