{% extends "base.html" %}
{% block titel %}Code · {{ vereniging }}{% endblock %}
{% block inhoud %}
<h1>Code uit je authenticator-app</h1>
<section class="dj-panel">
  <form class="bl-formulier" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="ds-field">
      <label class="ds-field__label" for="code">Code van zes cijfers</label>
      <input class="ds-input" id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required autofocus>
    </div>
    <button type="submit" class="ds-btn ds-btn--primary">Inloggen</button>
  </form>
</section>
{% endblock %}
