# Lokaal: docker compose -f docker-compose.yml -f compose.dev.yml up --build
# Draait op http://localhost:8080 zonder TLS, met herladen van de code.

services:
  db:
    ports: !override ["127.0.0.1:5432:5432"]

  # Lokaal is de stub de ledenbron, met de synthetische leden uit tests/fixtures.
  web:
    environment:
      GUNICORN_CMD_ARGS: --reload
      LEDENBRON: stub
    volumes:
      - ./app:/app/app:ro
      - ./tests/fixtures:/app/tests/fixtures:ro

  worker:
    environment:
      LEDENBRON: stub
    volumes:
      - ./app:/app/app:ro
      - ./tests/fixtures:/app/tests/fixtures:ro

  nginx:
    ports: !override ["127.0.0.1:8080:8080"]
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/http.inc:/etc/nginx/conf.d/http.inc:ro
      - ./docker/nginx/app.inc:/etc/nginx/conf.d/app.inc:ro

  # Unit- en integratietests tegen een eigen database botenloods_test op dezelfde server:
  # docker compose -f docker-compose.yml -f compose.dev.yml run --rm test
  test:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    image: botenloods-dev
    command: ["pytest"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_WEB_WACHTWOORD: ${DB_WEB_WACHTWOORD}
      DB_TAKEN_WACHTWOORD: ${DB_TAKEN_WACHTWOORD}
    volumes:
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
      - ./migrations:/app/migrations:ro
    depends_on:
      db: {condition: service_healthy}

  # E2E met Playwright tegen de draaiende stack: tests/e2e/draai.sh
  e2e:
    profiles: [e2e]
    build:
      context: tests/e2e
    network_mode: "service:nginx"
    environment:
      E2E_BASIS_URL: http://localhost:8080
    volumes:
      - ./tests/e2e:/e2e
    working_dir: /e2e
    command: ["pytest", "-p", "no:cacheprovider"]
