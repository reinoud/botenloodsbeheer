{% extends "base.html" %}
{% block titel %}Token maken · {{ vereniging }}{% endblock %}
{% block inhoud %}
<h1>Token maken</h1>
<section class="kaart">
  <form method="post" action="{{ url_for('web.token_nieuw') }}">
    {% include "_csrf.html" %}
    <fieldset>
      <legend>Soort</legend>
      <label class="keuze"><input type="radio" name="soort" value="persoonlijk"{% if invoer.soort != 'robot' %} checked{% endif %}> Persoonlijk: hoort bij jou en werkt niet meer als je account geblokkeerd of verwijderd is</label>
      <label class="keuze"><input type="radio" name="soort" value="robot"{% if invoer.soort == 'robot' %} checked{% endif %}> Robot: voor een koppeling, blijft werken als jij vertrekt</label>
    </fieldset>
    <label for="naam">Naam (a-z, cijfers, punt, - en _)</label>
    <input id="naam" name="naam" value="{{ invoer.naam }}" maxlength="50" required>
    <label for="dagen">Geldig, in dagen (hooguit {{ max_dagen }}, dat is 3 jaar)</label>
    <input id="dagen" name="dagen" type="number" min="1" max="{{ max_dagen }}" value="{{ invoer.dagen }}" required>
    <fieldset>
      <legend>Rechten (minstens één)</legend>
      {% for r in rechten %}
      <label class="keuze"><input type="checkbox" name="recht" value="{{ r }}"{% if r in invoer.rechten %} checked{% endif %}> {{ r }}{% if r == 'leden:importeren' %} (alleen robot){% endif %}</label>
      {% endfor %}
    </fieldset>
    <label for="whitelist">IP-whitelist: adressen of reeksen, gescheiden door komma's. Verplicht bij een robot. Leeg bij een persoonlijk token: elk adres dat de installatie doorlaat.</label>
    <input id="whitelist" name="whitelist" value="{{ invoer.whitelist }}">
    <button type="submit" class="knop">Token maken</button>
  </form>
</section>
<p><a href="{{ url_for('web.tokens_overzicht') }}">Terug naar tokens</a></p>
{% endblock %}
