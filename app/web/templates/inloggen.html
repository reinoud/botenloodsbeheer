{% extends "base.html" %}
{% block titel %}Inloggen · {{ vereniging }}{% endblock %}
{% block inhoud %}
<h1>Inloggen</h1>
<section class="kaart">
  <h2>Met een passkey</h2>
  <button type="button" class="ds-btn ds-btn--primary" id="passkey-inloggen"
          data-opties="{{ url_for('web.inloggen_passkey_opties') }}"
          data-verifieer="{{ url_for('web.inloggen_passkey') }}">Inloggen met passkey</button>
  <div class="ds-notice ds-notice--danger melding" hidden>
    <span class="ds-notice__mark" aria-hidden="true">!</span>
    <p class="ds-notice__body" id="passkey-fout" role="alert"></p>
  </div>
</section>
<section class="kaart">
  <h2>Met wachtwoord en code</h2>
  <form method="post" action="{{ url_for('web.inloggen_wachtwoord') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="ds-field">
      <label class="ds-field__label" for="gebruikersnaam">Gebruikersnaam</label>
      <input class="ds-input" id="gebruikersnaam" name="gebruikersnaam" autocomplete="username" required>
    </div>
    <div class="ds-field">
      <label class="ds-field__label" for="wachtwoord">Wachtwoord</label>
      <input class="ds-input" id="wachtwoord" name="wachtwoord" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="ds-btn ds-btn--primary">Verder</button>
  </form>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='passkey.js') }}"></script>{% endblock %}
